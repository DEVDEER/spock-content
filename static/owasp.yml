variables:
  - group: ${{ variables['System.TeamProject'] }}
  - name: 'ServiceConnection'
    value: 'lz-dd-odo'
  - name: 'Project'
    value: ${{ variables['System.TeamProject'] }}
  - name: 'Stage'
    value: 'test'

pool:
  vmImage: 'ubuntu-latest'

trigger: none

schedules:
  # Run daily at midnight
  - cron: '0 0 * * *'
    displayName: Daily
    branches:
      include:
        - main
    always: true

jobs:
  - job: DependencyCheck
    displayName: 'OWASP Dependency Check'
    timeoutInMinutes: 100
    steps:
      - task: AzureCLI@2
        displayName: Run job
        inputs:
          azureSubscription: $(ServiceConnection)
          scriptType: 'pscore'
          scriptLocation: 'inlineScript'
          workingDirectory: '$(Agent.WorkFolder)'
          inlineScript: |
            mkdir dependency-check
            Write-Host "Created folder for dependency-check"
            $res = az containerapp job start -n cj-owasp-$(Project)-dd-odo-test -g rg-odo-test --query name -o tsv
            Write-Host  "Job with name $res started."
            while ($true) {
              Start-Sleep 3
              $jobState = az containerapp job execution show -n cj-owasp-$(Project)-dd-odo-test -g rg-odo-test --job-execution-name $res --query "properties.status" -o tsv
              if ($jobState -eq 'Failed') {
                exit 1
              }
              if ($jobState -eq 'Succeeded') {
                exit 0
              }
            }

      - task: AzurePowerShell@5
        displayName: Downloading results
        inputs:
          azureSubscription: $(ServiceConnection)
          azurePowerShellVersion: 'LatestVersion'
          workingDirectory: '$(Agent.WorkFolder)/dependency-check'
          pwsh: true
          ScriptType: 'InlineScript'
          inline: |
            $container = 'reports'
            $Project = "$(Project)".ToLower()
            $Stage = "$(Stage)".ToLower()
            $downloaded = 0
            $account = "stoddodoshare$Stage"
            $date = (Get-Date).ToUniversalTime().ToString('yyyyMMdd')
            $prefix = "$($Project)/$($date)/"
            $headers = @{
                'x-ms-version' = '2022-11-02'
            }
            Write-Host "Connecting to Azure storage account..."
            $key = (Get-AzStorageAccountKey -StorageAccountName $account -ResourceGroupName "rg-odo-$Stage")[1].Value
            $ctx = New-AzStorageContext -StorageAccountName $account -StorageAccountKey $key
            Write-Host "Connected to $($ctx.StorageAccountName)"
            $sas = New-AzStorageContainerSASToken -Name $container -Permission rl -ExpiryTime (Get-Date).AddHours(1) -Context $ctx
            Write-Host "Received SAS token for container $container"
            $sasQuery = $sas.TrimStart('?')
            $marker = $null
            do {
                $listUrl = "https://$account.blob.core.windows.net/$($container)?restype=container&comp=list&prefix=$([uri]::EscapeDataString($prefix))&$sasQuery"
                if ($marker) {
                    $listUrl += "&marker=$([uri]::EscapeDataString($marker))"
                }
                $raw = Invoke-RestMethod -Uri $listUrl -Headers $headers
                $raw
                [xml]$res = $raw.TrimStart([char]0xFEFF)
                foreach ($blobName in $res.EnumerationResults.Blobs.Blob.Name) {
                    $fileName = Split-Path $blobName -Leaf
                    $url = "https://$account.blob.core.windows.net/$container/$($blobName)?$sasQuery"
                    Invoke-WebRequest -Uri $url -Headers $headers -OutFile $fileName
                    Write-Host "Downloaded $fileName"
                    $downloaded++
                }
                $marker = $res.EnumerationResults.NextMarker
            } while ($marker)
            if ($downloaded -eq 0) {
              Write-Host "Error: No files found!"
              exit 1
            }
            exit 0

      - task: PublishTestResults@2
        displayName: 'Publish OWASP Test Results'
        inputs:
          testResultsFiles: '*junit.xml'
          searchFolder: '$(Agent.WorkFolder)/dependency-check'
          testRunTitle: 'OWASP Dependency Check'
          failTaskOnFailedTests: true

      - task: CopyFiles@2
        displayName: Copy Reports
        inputs:
          sourceFolder: '$(Agent.WorkFolder)/dependency-check'
          contents: '**'
          targetFolder: $(Build.ArtifactStagingDirectory)

      - task: PublishBuildArtifacts@1
        displayName: 'Publish Artifact'
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        condition: succeededOrFailed()
